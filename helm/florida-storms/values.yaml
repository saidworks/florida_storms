replicaCount: 2

image:
  repository: hurdat2-florida
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 1234

spring:
  profiles:
    active: prod

resources:
  limits:
    cpu: "1"
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 512Mi

probes:
  liveness:
    path: /actuator/health/liveness
    initialDelaySeconds: 30
    periodSeconds: 10
  readiness:
    path: /actuator/health/readiness
    initialDelaySeconds: 20
    periodSeconds: 5

redis:
  enabled: true
  image: redis:7-alpine
  port: 6379
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

cyclone:
  cache:
    ttl: PT24H
